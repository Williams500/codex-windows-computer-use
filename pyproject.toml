[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-windows-computer-use"
version = "0.1.0"
description = "Generic Windows computer-use runtime for Codex and other agents"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.0",
  "pywinauto>=0.6.8",
]

[project.scripts]
win-cu = "windows_cu.cli:main"

[tool.setuptools]
packages = ["windows_cu"]
